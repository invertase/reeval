<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ledger pricing</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 4rem; }
      button { padding: 0.75rem 1.5rem; font-size: 1rem; }
    </style>
  </head>
  <body>
    <h1>Ledger</h1>
    <button id="show-price" type="button">Show price</button>
    <p id="price" hidden>$12 a month</p>
    <script>
      document.getElementById('show-price').addEventListener('click', () => {
        document.getElementById('price').hidden = false
      })
    </script>
  </body>
</html>
