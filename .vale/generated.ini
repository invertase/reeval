# .vale.ini without the generated-block ignore, for .vale/lint.mjs. Keep the
# two in step.

StylesPath = styles
MinAlertLevel = suggestion

# Run as `vale docs`. mdx2vast skips the text inside JSX components (Step,
# Info, Property), so the pages are read as Markdown instead.
[formats]
mdx = md

# Ignores apply only under a file-name glob, not a docs/**/ one. In an ini
# value `#` starts a comment and a backtick quotes, hence \x23 and \x60.
[*.mdx]
BasedOnStyles = Reeval
TokenIgnores = (\x60[^\x60\n]+\x60)

# Glossary terms are deliberately lowercase identifiers, and its shared-words
# entries name the code words (effort, judge) that Terminology steers away from.
[docs/reference/glossary.mdx]
Reeval.Headings = NO
Reeval.Terminology = NO
