extends: substitution
message: "Use US spelling: '%s', not '%s'."
level: error
ignorecase: true
swap:
  # -our
  colou?rs?: color
  colou?red: colored
  colou?ring: coloring
  colourful: colorful
  behaviours?: behavior
  behavioural: behavioral
  favours?: favor
  favoured: favored
  favourite: favorite
  honours?: honor
  honoured: honored
  labours?: labor
  neighbours?: neighbor
  humours?: humor
  flavours?: flavor
  rumours?: rumor
  # -ise and -isation
  analyse: analyze
  analysed: analyzed
  analysing: analyzing
  analyser: analyzer
  recognis(?:e|es): recognize
  recognised: recognized
  recognising: recognizing
  organis(?:e|es): organize
  organised: organized
  organising: organizing
  organisations?: organization
  optimis(?:e|es): optimize
  optimised: optimized
  optimising: optimizing
  optimisations?: optimization
  normalis(?:e|es): normalize
  normalised: normalized
  normalising: normalizing
  normalisation: normalization
  unnormalised: unnormalized
  serialis(?:e|es): serialize
  serialised: serialized
  serialising: serializing
  serialisation: serialization
  deserialis(?:e|es|ed|ing): deserialize
  initialis(?:e|es): initialize
  initialised: initialized
  initialising: initializing
  initialisation: initialization
  summaris(?:e|es): summarize
  summarised: summarized
  summarising: summarizing
  prioritis(?:e|es): prioritize
  prioritised: prioritized
  prioritising: prioritizing
  customis(?:e|es): customize
  customised: customized
  customising: customizing
  customisation: customization
  authoris(?:e|es): authorize
  authorised: authorized
  authorising: authorizing
  authorisation: authorization
  unauthorised: unauthorized
  minimis(?:e|es): minimize
  minimised: minimized
  minimising: minimizing
  maximis(?:e|es): maximize
  maximised: maximized
  maximising: maximizing
  finalis(?:e|es): finalize
  finalised: finalized
  finalising: finalizing
  standardis(?:e|es): standardize
  standardised: standardized
  standardising: standardizing
  categoris(?:e|es): categorize
  categorised: categorized
  categorising: categorizing
  emphasis(?:e|es): emphasize
  emphasised: emphasized
  emphasising: emphasizing
  realis(?:e|es): realize
  realised: realized
  realising: realizing
  specialis(?:e|es): specialize
  specialised: specialized
  visualis(?:e|es): visualize
  visualised: visualized
  visualising: visualizing
  visualisation: visualization
  synchronis(?:e|es): synchronize
  synchronised: synchronized
  synchronising: synchronizing
  sanitis(?:e|es): sanitize
  sanitised: sanitized
  sanitising: sanitizing
  tokenis(?:e|es): tokenize
  tokenised: tokenized
  tokenising: tokenizing
  parametris(?:e|es|ed|ing): parameterize
  parameteris(?:e|es|ed|ing): parameterize
  apologis(?:e|es|ed|ing): apologize
  utilis(?:e|es|ed|ing): use
  memoris(?:e|es|ed|ing): memorize
  randomis(?:e|es): randomize
  randomised: randomized
  randomising: randomizing
  randomisation: randomization
  stabilis(?:e|es|ed|ing): stabilize
  generalis(?:e|es|ed|ing): generalize
  materialis(?:e|es|ed|ing): materialize
  # -re
  centres?: center
  centred: centered
  metres?: meter
  litres?: liter
  fibres?: fiber
  theatres?: theater
  # doubled consonants
  cancelled: canceled
  cancelling: canceling
  labelled: labeled
  labelling: labeling
  modelled: modeled
  modelling: modeling
  travelled: traveled
  travelling: traveling
  signalled: signaled
  signalling: signaling
  levelled: leveled
  totalled: totaled
  fuelled: fueled
  marshalled: marshaled
  marshalling: marshaling
  tunnelled: tunneled
  tunnelling: tunneling
  # -ence, -ogue and others
  licences?: license
  defences?: defense
  offences?: offense
  pretences?: pretense
  catalogues?: catalog
  catalogued: cataloged
  dialogues?: dialog
  analogues?: analog
  artefacts?: artifact
  judgements?: judgment
  acknowledgements?: acknowledgment
  ageing: aging
  greys?: gray
  programmes?: program
  practis(?:e|es|ed|ing): practice
  enrol(?:s|ment)?: enroll
  fulfil(?:s|ment)?: fulfill
  instal(?:s|ment)?: install
  skilful: skillful
  wilful: willful
  manoeuvres?: maneuver
  plough: plow
  aluminium: aluminum
  cheque: check
  tyres?: tire
  # -wards and others
  towards: toward
  afterwards: afterward
  backwards: backward
  forwards: forward
  upwards: upward
  downwards: downward
  onwards: onward
  whilst: while
  amongst: among
  learnt: learned
  spelt: spelled
  dreamt: dreamed
  burnt: burned
  spilt: spilled
