# Checks Reeval.Your on docs/overview.mdx outside its lead, which .vale.ini
# leaves to this file. .vale/lint.mjs runs it; keep the lead's pattern here
# in step with the first three paragraphs under "## Introduction". It lints one
# file at a time, so its section is a file-name glob: Vale before 3.18.0 ignored
# BlockIgnores under a path section such as [docs/overview.mdx].

StylesPath = styles
MinAlertLevel = suggestion

[formats]
mdx = md

[*.mdx]
Reeval.Your = YES
BlockIgnores = (?s)(\x23\x23 Introduction\n\n(?:[^\n]+(?:\n[^\n]+)*\n\n){2}[^\n]+(?:\n[^\n]+)*)
TokenIgnores = (\x60[^\x60\n]+\x60)
