# Checks Reeval.Your on docs/index.mdx outside its lead, which .vale.ini
# leaves to this file. .vale/lint.mjs runs it; keep the lead's pattern here
# in step with the first three paragraphs under "## Introduction". The section
# name is the root-relative path it passes.

StylesPath = styles
MinAlertLevel = suggestion

[formats]
mdx = md

[docs/index.mdx]
Reeval.Your = YES
BlockIgnores = (?s)(\x23\x23 Introduction\n\n(?:[^\n]+(?:\n[^\n]+)*\n\n){2}[^\n]+(?:\n[^\n]+)*)
TokenIgnores = (\x60[^\x60\n]+\x60)
