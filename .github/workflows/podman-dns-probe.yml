# TEMPORARY diagnostic for the rootless Podman egress/deny-all canary; removed before review.
name: podman-dns-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  raw:
    name: probe (raw podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: host resolver
        run: |
          podman info --format '{{.Version.Version}} rootless={{.Host.Security.Rootless}} {{.Host.NetworkBackend}} slirp={{.Host.Slirp4NetNS.Executable}} pasta={{.Host.Pasta.Executable}}'
          ls -l /etc/resolv.conf; cat /etc/resolv.conf
          echo ---; cat /run/systemd/resolve/resolv.conf || true
          echo ---; resolvectl status || true
          podman pull -q docker.io/library/debian:bookworm-slim
      - name: open container alone
        run: |
          for i in $(seq 1 40); do
            podman run --rm --network bridge -e I=$i debian:bookworm-slim sh -c \
              '[ "$I" = 1 ] && cat /etc/resolv.conf; s=$(date +%s); getent hosts example.com >/dev/null; echo "alone $I dns=$? $(( $(date +%s)-s ))s"' 2>&1 | grep -v 'shared mount' || true
          done
      - name: open container beside a disconnected one
        run: |
          slirp() { pgrep -f slirp4netns | tr '\n' ' '; }
          for i in $(seq 1 60); do
            b=$(podman run -d --rm --network bridge debian:bookworm-slim sleep 600)
            before=$(slirp)
            podman network disconnect -f podman "$b" &
            a=$(podman run -d --rm --network bridge debian:bookworm-slim sleep 600)
            wait
            out=$(podman exec "$a" sh -c 's=$(date +%s); getent hosts example.com >/dev/null; r=$?; echo "dns=$r $(( $(date +%s)-s ))s"; [ $r = 0 ] || cat /etc/resolv.conf | tr "\n" " "')
            wait
            echo "beside $i $out slirp: $before -> $(slirp)"
            podman rm -f -t 0 "$a" "$b" >/dev/null 2>&1 &
          done
          wait
      - name: open container while another starts and stops
        run: |
          slirp() { pgrep -f slirp4netns | tr '\n' ' '; }
          for i in $(seq 1 40); do
            a=$(podman run -d --rm --network bridge debian:bookworm-slim sleep 600)
            ( for k in 1 2 3; do podman run --rm --network bridge debian:bookworm-slim true; done ) &
            before=$(slirp)
            out=$(podman exec "$a" sh -c 's=$(date +%s); getent hosts example.com >/dev/null; r=$?; echo "dns=$r $(( $(date +%s)-s ))s"')
            wait
            echo "churn $i $out slirp: $before -> $(slirp)"
            podman rm -f -t 0 "$a" >/dev/null 2>&1
          done

  fixture:
    name: probe (deny-all fixture loop)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REEVAL_TEST_ENGINE: podman
      REEVAL_TEST_REQUIRE_PODMAN: '1'
      REEVAL_FIXTURE_TIERS: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: reeval's image, in Podman's store
        run: |
          node --input-type=module -e "
            import { buildImage } from './packages/sandbox-docker/dist/index.js'
            await buildImage(console.log, { harness: 'cursor', engine: 'podman' })"
      - name: loop
        working-directory: packages/reeval
        run: |
          (while true; do date +%T; pgrep -af slirp4netns; sleep 2; done) > /tmp/slirp.log &
          for i in $(seq 1 25); do
            node --test --experimental-strip-types --no-warnings --test-name-pattern='egress/deny-all \[podman\]' test/features.test.ts > /tmp/run.log 2>&1 \
              && echo "run $i ok" || { echo "run $i FAIL"; grep -E "dns=|turn 1 done" /tmp/run.log | head -6; }
          done
          echo; sort -u -k2 /tmp/slirp.log | head -40
