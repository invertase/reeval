# TEMPORARY diagnostic for the rootless Podman egress/deny-all canary; removed before review.
name: podman-dns-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixture:
    name: probe (deny-all fixture loop)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REEVAL_TEST_ENGINE: podman
      REEVAL_TEST_REQUIRE_PODMAN: '1'
      REEVAL_FIXTURE_TIERS: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: reeval's image, in Podman's store
        run: |
          node --input-type=module -e "
            import { buildImage } from './packages/sandbox-docker/dist/index.js'
            await buildImage(console.log, { harness: 'cursor', engine: 'podman' })"
      - name: diagnostics in the dns probe
        working-directory: packages/reeval/test/features/egress/deny-all
        run: |
          cat > /tmp/diag.sh <<'EOF'
          s=$(date +%s); getent hosts example.com >/dev/null; r=$?; echo "dns=$r"
          if [ $r != 0 ] && grep -q eth /proc/net/dev; then
            echo "took=$(( $(date +%s)-s ))s at $(date +%T)"; cat /etc/resolv.conf | tr '\n' ' '
            s=$(date +%s); getent ahostsv4 example.com >/dev/null; echo "retry=$? $(( $(date +%s)-s ))s"
            for ns in 168.63.129.16 8.8.8.8; do
              node -e "const r=new (require('dns').promises.Resolver)({timeout:3000,tries:1});r.setServers(['$ns']);r.resolve4('example.com').then(a=>console.log('$ns ok',a[0]),e=>console.log('$ns',e.code))" 2>/dev/null
            done
            curl -s -m 5 --noproxy '*' -o /dev/null -w 'tcp1111=%{http_code}' https://1.1.1.1/; echo " exit=$?"
            cat /proc/net/route | tr '\n' ' '
          fi
          EOF
          node -e "
            const fs=require('fs');const f='reeval.config.ts';
            const s=fs.readFileSync(f,'utf8').replace(/\{ exec: \`getent[^\n]*\n/, '{ exec: ' + JSON.stringify(fs.readFileSync('/tmp/diag.sh','utf8')) + ' },\n');
            fs.writeFileSync(f,s)"
          cat reeval.config.ts
      - name: loop the podman tier
        working-directory: packages/reeval
        run: |
          (while true; do echo "$(date +%T) $(pgrep -f slirp4netns | tr '\n' ' ')"; sleep 1; done) > /tmp/slirp.log &
          for i in $(seq 1 9); do
            (cd ../sandbox-docker && pnpm test > /tmp/sd.log 2>&1) || echo "sandbox-docker $i failed"
            echo "sd $i done $(date +%T)"
            node --test --experimental-strip-types --no-warnings --test-name-pattern='\[podman\]' test/features.test.ts > /tmp/run.log 2>&1 \
              && echo "run $i ok $(date +%T)" || { echo "run $i FAIL $(date +%T)"; grep -E "not ok|dns=|turn 1 done|took=" /tmp/run.log | head -12; }
          done
          echo; uniq -f1 /tmp/slirp.log | head -200
