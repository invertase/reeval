# Releases reeval (npm) and reeval-python (PyPI) in lockstep: reeval-python downloads the reeval
# binary of its own version, so both carry one version. release-please keeps one release PR open
# from Conventional Commits on main; merging it tags vX.Y.Z. Then ci.yml runs on that commit; npm
# publishes the tarball its packed install job packed, with trusted publishing (OIDC, environment
# `npm`), and PyPI the sdist and wheel its lint job built, with OIDC, environment `pypi`.
# Publishing jobs must stay on this push-to-main trigger only (not tag push or `release` events) so
# GitHub environments that allow deployment from branch `main` still approve the job.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: Run full CI on main and publish npm/PyPI from the manifest (tags must already exist)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'invertase/reeval' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflows, so the release PR's checks
          # wouldn't run. RELEASE_PLEASE_TOKEN (a GitHub App or fine-grained token) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The test job runs this push's commit, so a release tagged elsewhere (created late, after
      # a failed run) must not publish it.
      - if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The release is tagged at $RELEASE_SHA, not this push's $GITHUB_SHA, so it isn't tested or published."
            exit 1
          fi

  republish-gate:
    name: republish gate
    if: github.repository == 'invertase/reeval' && github.event_name == 'workflow_dispatch' && inputs.republish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.check.outputs.release_created }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - id: check
        run: |
          set -euo pipefail
          v=$(jq -r '."."' .release-please-manifest.json)
          git rev-parse "refs/tags/v${v}^{commit}" >/dev/null
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: [release-please, republish-gate]
    if: |
      always() && !cancelled() && !failure() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.result == 'success')
      )
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm
    needs: [release-please, republish-gate, test]
    if: |
      always() && needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.outputs.release_created == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Provenance is automatic with trusted publishing, but npm only generates it for public
      # repositories.
      - name: Publish to npm
        run: |
          set -euo pipefail
          tgz=$(ls "$RUNNER_TEMP"/package/*.tgz)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver=$(tar -xOf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if npm view "reeval@${ver}" version >/dev/null 2>&1; then
              echo "::notice::reeval@${ver} is already on npm, skipping publish"
              exit 0
            fi
          fi
          npm publish --access public "$tgz"

  publish-pypi:
    name: publish to PyPI
    needs: [release-please, republish-gate, test]
    if: |
      always() && needs.test.result == 'success' && github.repository == 'invertase/reeval' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.outputs.release_created == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reeval-python-dist
          path: ${{ runner.temp }}/reeval-python-dist
      # The release PR sets reeval-python's version with reeval's; a mismatch would ship an SDK
      # that downloads another reeval.
      - name: Check the version
        env:
          DIST: ${{ runner.temp }}/reeval-python-dist
          WANT: ${{ needs.release-please.outputs.version || needs.republish-gate.outputs.version }}
        run: |
          set -euo pipefail
          wheel=$(ls "$DIST"/reeval_python-*.whl)
          if [ "$(basename "$wheel")" != "reeval_python-${WANT}-py3-none-any.whl" ]; then
            echo "::error::Built $(basename "$wheel"), but this release is reeval ${WANT}."
            exit 1
          fi
      # v1.14.3 (aef6c9b): commit SHAs are not published to ghcr.io; the release tag is.
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/reeval-python-dist
          skip-existing: true
