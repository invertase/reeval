# Releases reeval (npm) and reeval-python (PyPI) in lockstep: reeval-python downloads the reeval
# binary of its own version, so both carry one version. release-please keeps one release PR open
# from Conventional Commits on main; merging it tags vX.Y.Z. Then ci.yml runs on that commit; npm
# publishes the tarball its packed install job packed, with trusted publishing (OIDC, environment
# `npm`). binary.yml builds the standalone binaries, which go up to the release with their
# SHA256SUMS, and reeval-python's sdist and wheels, which record those binaries' hashes; once the
# binaries are up, PyPI gets those, with OIDC, environment `pypi`. A republish builds the tag.
# Publishing jobs must stay on this push-to-main trigger only (not tag push or `release` events) so
# GitHub environments that allow deployment from branch `main` still approve the job.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: Run full CI on the release tag the manifest names, and publish npm/PyPI from it (the tag must exist)
        type: boolean
        default: true
      dry_run:
        description: Only build and smoke-test the binaries, and list what would be uploaded to the release; publish nothing
        type: boolean
        default: false
      replace_binaries:
        description: Replace binaries the release already has (otherwise a release with any binaries is left alone)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'invertase/reeval' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflows, so the release PR's checks
          # wouldn't run. RELEASE_PLEASE_TOKEN (a GitHub App or fine-grained token) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The test job runs this push's commit, so a release tagged elsewhere (created late, after
      # a failed run) must not publish it.
      - if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The release is tagged at $RELEASE_SHA, not this push's $GITHUB_SHA, so it isn't tested or published."
            exit 1
          fi

  republish-gate:
    name: republish gate
    if: github.repository == 'invertase/reeval' && github.event_name == 'workflow_dispatch' && (inputs.republish || inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.check.outputs.release_created }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - id: check
        run: |
          set -euo pipefail
          v=$(jq -r '."."' .release-please-manifest.json)
          sha=$(git rev-parse "refs/tags/v${v}^{commit}")
          {
            echo "release_created=true"
            echo "version=${v}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: [release-please, republish-gate]
    if: |
      always() && !cancelled() && !failure() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.result == 'success' && !inputs.dry_run)
      )
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.republish-gate.outputs.sha || github.sha }}

  # Built from the release's tagged commit, whichever ref the run was dispatched on. A push run's
  # commit is the release's (release-please checks it), and the SHA can't resolve to a branch.
  binaries:
    name: binaries
    needs: [release-please, republish-gate, test]
    if: |
      always() && !cancelled() && !failure() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true' && needs.test.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.outputs.release_created == 'true' && (inputs.dry_run || needs.test.result == 'success'))
      )
    permissions:
      contents: read
    uses: ./.github/workflows/binary.yml
    with:
      ref: ${{ needs.republish-gate.outputs.sha || github.sha }}

  upload-binaries:
    name: upload binaries
    needs: [release-please, republish-gate, binaries]
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.binaries.outputs.artifact }}
          path: out
      # SHA256SUMS goes up after the binaries, so it never lists binaries the release doesn't have.
      # A release with SHA256SUMS keeps its binaries unless replace_binaries is set: a rebuild isn't
      # byte-identical, so replacing them changes their published checksums. Without SHA256SUMS
      # (an upload cut short), the binaries it has must match this build's sums, as a re-run of the
      # failed job's do, and the rest are added.
      - name: Upload to the release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release-please.outputs.version || needs.republish-gate.outputs.version }}
          VERSION: ${{ needs.binaries.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          REPLACE: ${{ inputs.replace_binaries || false }}
        run: |
          set -euo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The binaries are reeval $VERSION, but the release is $TAG."
            exit 1
          fi
          sha256sum -c SHA256SUMS
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets"
          has() { grep -qxF "$1" "$RUNNER_TEMP/assets"; }
          binaries=(reeval-*)
          upload=()
          if [ "$REPLACE" = true ]; then
            upload=("${binaries[@]}")
            for f in "${binaries[@]}" SHA256SUMS; do
              if has "$f"; then echo "$TAG: replace $f"; else echo "$TAG: add $f"; fi
            done
          elif has SHA256SUMS; then
            level=error
            [ "$DRY_RUN" = true ] && level=notice
            echo "::$level::$TAG already has its binaries; dispatch with replace_binaries=true to replace them."
            [ "$DRY_RUN" = true ] && exit 0
            exit 1
          else
            mkdir "$RUNNER_TEMP/uploaded"
            for f in "${binaries[@]}"; do
              if has "$f"; then
                gh release download "$TAG" --pattern "$f" --dir "$RUNNER_TEMP/uploaded"
                want=$(awk -v f="$f" '$2 == f || $2 == "*" f { print $1 }' SHA256SUMS)
                got=$(sha256sum "$RUNNER_TEMP/uploaded/$f" | cut -d' ' -f1)
                if [ "$want" != "$got" ]; then
                  echo "::error::$TAG has a $f that isn't this build's; dispatch with replace_binaries=true to replace the release's binaries."
                  exit 1
                fi
                echo "$TAG: keep $f, the same as this build's"
              else
                upload+=("$f")
                echo "$TAG: add $f"
              fi
            done
            echo "$TAG: add SHA256SUMS"
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: nothing uploaded to $TAG"
            exit 0
          fi
          if [ "$REPLACE" = true ]; then
            if has SHA256SUMS; then gh release delete-asset "$TAG" SHA256SUMS --yes; fi
            gh release upload "$TAG" "${upload[@]}" --clobber
          elif [ ${#upload[@]} -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}"
          fi
          gh release upload "$TAG" SHA256SUMS

  publish:
    name: publish to npm
    needs: [release-please, republish-gate, test]
    if: |
      always() && needs.test.result == 'success' && !inputs.dry_run &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.outputs.release_created == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Provenance is automatic with trusted publishing, but npm only generates it for public
      # repositories.
      - name: Publish to npm
        run: |
          set -euo pipefail
          tgz=$(ls "$RUNNER_TEMP"/package/*.tgz)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver=$(tar -xOf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if npm view "reeval@${ver}" version >/dev/null 2>&1; then
              echo "::notice::reeval@${ver} is already on npm, skipping publish"
              exit 0
            fi
          fi
          npm publish --access public "$tgz"

  # After the binaries are on the release, so the pure wheel's download never finds them missing.
  publish-pypi:
    name: publish to PyPI
    needs: [release-please, republish-gate, test, binaries, upload-binaries]
    if: |
      always() && needs.test.result == 'success' && needs.upload-binaries.result == 'success' &&
      !inputs.dry_run && github.repository == 'invertase/reeval' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.republish-gate.outputs.release_created == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release-please.outputs.version || needs.republish-gate.outputs.version }}
          persist-credentials: false
          sparse-checkout: scripts/python-wheels.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reeval-python-dist
          path: ${{ runner.temp }}/reeval-python-dist
      # Every file must be this release's version (1.0.0-beta.1 is reeval-python 1.0.0b1), and every
      # wheel must record these binaries: a mismatch would ship an SDK that downloads another reeval.
      - name: Check the version
        env:
          DIST: ${{ runner.temp }}/reeval-python-dist
          WANT: ${{ needs.release-please.outputs.version || needs.republish-gate.outputs.version }}
        run: python3 scripts/python-wheels.py check "$DIST" "$WANT"
      # v1.14.3 (aef6c9b): commit SHAs are not published to ghcr.io; the release tag is.
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/reeval-python-dist
          skip-existing: true
