# Releases reeval (npm) and reeval-python (PyPI). release-please keeps release PRs open from
# Conventional Commits on main; merging tags reeval-vX.Y.Z and reeval-python-vX.Y.Z separately.
# Then ci.yml runs on that commit; npm publishes the packed tarball with trusted publishing (OIDC,
# environment `npm`). PyPI publishes from packages/reeval-python with OIDC, environment `pypi`.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'invertase/reeval' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      any_created: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs['packages/reeval-python--release_created'] == 'true' }}
      npm_created: ${{ steps.release.outputs.release_created }}
      pypi_created: ${{ steps.release.outputs['packages/reeval-python--release_created'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflows, so the release PR's checks
          # wouldn't run. RELEASE_PLEASE_TOKEN (a GitHub App or fine-grained token) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The test job runs this push's commit, so a release tagged elsewhere (created late, after
      # a failed run) must not publish it.
      - if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The reeval release is tagged at $RELEASE_SHA, not this push's $GITHUB_SHA, so it isn't tested or published."
            exit 1
          fi
      - if: steps.release.outputs['packages/reeval-python--release_created'] == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs['packages/reeval-python--sha'] }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The reeval-python release is tagged at $RELEASE_SHA, not this push's $GITHUB_SHA, so it isn't tested or published."
            exit 1
          fi

  test:
    name: test
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.any_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm
    needs: [release-please, test]
    if: github.event_name == 'push' && needs.release-please.outputs.npm_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Provenance is automatic with trusted publishing, but npm only generates it for public
      # repositories.
      - run: npm publish --access public "$RUNNER_TEMP"/package/*.tgz

  publish-pypi:
    name: publish to PyPI
    needs: [release-please, test]
    if: github.event_name == 'push' && needs.release-please.outputs.pypi_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Build sdist and wheel
        working-directory: packages/reeval-python
        run: uv build
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: packages/reeval-python/dist

  publish-testpypi:
    name: publish to TestPyPI (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Build sdist and wheel
        working-directory: packages/reeval-python
        run: uv build
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/reeval-python/dist
