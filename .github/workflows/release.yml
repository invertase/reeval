# Releases @invertase/foobar. release-please keeps a release PR open from the Conventional
# Commits on main (version, CHANGELOG.md); merging it tags vX.Y.Z and creates the GitHub release.
# Then ci.yml runs on that commit, and the tarball its pack job uploads is published to npm with
# trusted publishing (OIDC, no token). npm's trusted publisher for the package names this file
# and the `npm` environment, so keep both names in sync with npm.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'invertase/reeval'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflows, so the release PR's checks
          # wouldn't run. RELEASE_PLEASE_TOKEN (a GitHub App or fine-grained token) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The test job runs this push's commit, so a release tagged elsewhere (created late, after
      # a failed run) must not publish it.
      - if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The release is tagged at $RELEASE_SHA, not this push's $GITHUB_SHA, so it isn't tested or published."
            exit 1
          fi

  test:
    name: test
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Provenance is automatic with trusted publishing, but npm only generates it for public
      # repositories.
      - run: npm publish --access public "$RUNNER_TEMP"/package/*.tgz
