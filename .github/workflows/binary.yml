# Compiles reeval into standalone binaries with Bun, all cross-compiled on one Linux runner, then
# smoke-tests each on its own OS from an empty directory (scripts/binary-smoke.mjs). It runs
# *.eval.py with it on Python 3.11 to 3.14 with only uv besides (scripts/binary-python-smoke.mjs),
# through reeval-python's `reeval` command too, which downloads the binary (or finds it in a
# platform wheel, scripts/python-wheels.py). Then it installs it with scripts/install.sh or
# install.ps1 from those files. Uploads the binaries and SHA256SUMS as one artifact,
# `reeval-<version>-binaries`, which release.yml uploads to the release; reeval-python's sdist and
# pure wheel as `reeval-python-dist`, which release.yml publishes to PyPI; and its platform wheels
# as `reeval-python-platform-wheels`, for the smoke only.
name: binary

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to compile; the install scripts tested are still this run's
        type: string
        default: ''
    outputs:
      version:
        description: The version the binaries were built from
        value: ${{ jobs.compile.outputs.version }}
      artifact:
        description: The artifact holding the binaries and SHA256SUMS
        value: ${{ jobs.compile.outputs.artifact }}
  pull_request:
    paths:
      - .github/workflows/binary.yml
      - scripts/bun-compile.mjs
      - scripts/binary-smoke.mjs
      - scripts/binary-python-smoke.mjs
      - scripts/python-wheels.py
      - scripts/install.sh
      - scripts/install-test.sh
      - scripts/install.ps1
      - scripts/install-test.ps1
      - packages/reeval/src/root.ts
      - packages/reeval/src/bin.ts
      - packages/reeval/src/jiti.ts
      - packages/reeval/src/engine/pool.ts
      - packages/reeval/src/engine/worker-entry.ts
      - packages/reeval/src/studio/index.ts
      - packages/reeval/src/studio/app.ts
      - packages/reeval/src/studio/app-files.ts
      - packages/reeval/tsdown.config.mjs
      - packages/reeval/src/language-runner/**
      - packages/reeval-python/src/**
      - packages/reeval-python/pyproject.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2

jobs:
  compile:
    name: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: reeval-${{ steps.version.outputs.version }}-binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm build
      - id: version
        run: echo "version=$(node -p "require('./packages/reeval/package.json').version")" >> "$GITHUB_OUTPUT"
      # This runner's own target also runs bun-compile's checks against Node; the rest compile only.
      - name: bun build --compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 windows-x64 \
            linux-x64-baseline linux-x64-musl-baseline windows-x64-baseline; do
            name="reeval-$VERSION-$target"
            case $target in windows-*) name="$name.exe" ;; esac
            echo "::group::$target"
            start=$SECONDS
            node scripts/bun-compile.mjs --target "bun-$target" --outfile "out/$name"
            echo "$target: $((SECONDS - start))s"
            echo "::endgroup::"
          done
          cd out
          sha256sum reeval-* > SHA256SUMS
          {
            echo "| Binary | Size |"
            echo "|---|---|"
            for f in reeval-*; do echo "| \`$f\` | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reeval-${{ steps.version.outputs.version }}-binaries
          path: out/
          if-no-files-found: error
          retention-days: 14
      # reeval-python as release.yml publishes it: the sdist and the pure wheel, both recording the
      # binaries' hashes, at the binaries' version (python-wheels.py refuses any other; a release
      # commit already has it). The platform wheels, each carrying its target's binary, aren't
      # published (about 250 MB a release on PyPI); the smoke installs them.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: reeval-python sdist and wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WHEELS: uv run --no-project python scripts/python-wheels.py
        run: |
          (cd packages/reeval-python && uv version --frozen "$VERSION")
          $WHEELS manifest out "$VERSION" packages/reeval-python/src/reeval_python
          uv build --out-dir python-dist packages/reeval-python
          $WHEELS check python-dist "$VERSION"
          $WHEELS platform python-dist/*-any.whl out platform-wheels
          $WHEELS check --platform platform-wheels "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reeval-python-dist
          path: python-dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reeval-python-platform-wheels
          path: platform-wheels/
          if-no-files-found: error
          retention-days: 14

  # No pnpm install and no build: the runner's preinstalled Node drives the binary.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: compile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, flags: --docker, wheel: manylinux_2_17_x86_64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, wheel: manylinux_2_17_aarch64 }
          - { target: linux-x64-musl, os: ubuntu-24.04, alpine: true, wheel: musllinux_1_2_x86_64 }
          - { target: linux-arm64-musl, os: ubuntu-24.04-arm, alpine: true, wheel: musllinux_1_2_aarch64 }
          - { target: darwin-arm64, os: macos-15, wheel: macosx_13_0_arm64 }
          - { target: darwin-x64, os: macos-15-intel, wheel: macosx_13_0_x86_64 }
          - { target: windows-x64, os: windows-2025, ext: .exe, wheel: win_amd64 }
          # x64 without AVX2, which the install scripts pick on such a CPU; smoke-tested only.
          - { target: linux-x64-baseline, os: ubuntu-24.04, baseline: true }
          - { target: linux-x64-musl-baseline, os: ubuntu-24.04, alpine: true, baseline: true }
          - { target: windows-x64-baseline, os: windows-2025, ext: .exe, baseline: true }
    steps:
      # Only what the smoke test reads; the full tree has paths past Windows' 260 characters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            scripts
            examples/hello
            packages/reeval/test/features/egress/blocked-host-recorded
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: current
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.compile.outputs.artifact }}
          path: out
      - name: Verify SHA256SUMS
        shell: bash
        working-directory: out
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c --ignore-missing SHA256SUMS
          else shasum -a 256 -c --ignore-missing SHA256SUMS; fi
      - if: ${{ !matrix.alpine }}
        shell: bash
        env:
          BINARY: out/reeval-${{ needs.compile.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
          FLAGS: ${{ matrix.flags }}
        run: node scripts/binary-smoke.mjs "$BINARY" $FLAGS
      # musl: Alpine, with git (which reeval needs) and Node to drive the binary.
      - if: ${{ matrix.alpine }}
        env:
          BINARY: out/reeval-${{ needs.compile.outputs.version }}-${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e BINARY node:22-alpine \
            sh -c 'apk add -q git && node scripts/binary-smoke.mjs "$BINARY"'
      # reeval-python from this commit: the sdist and pure wheel PyPI gets, and this target's
      # platform wheel.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reeval-python-dist
          path: wheels
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reeval-python-platform-wheels
          path: platform-wheels
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Python evals
        if: ${{ !matrix.alpine }}
        shell: bash
        env:
          BINARY: out/reeval-${{ needs.compile.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
          WHEEL: ${{ matrix.wheel }}
        run: |
          node scripts/binary-python-smoke.mjs "$BINARY" --wheel "$(ls wheels/*-any.whl)" \
            --sdist "$(ls wheels/*.tar.gz)" --platform-wheel "$(ls platform-wheels/*"$WHEEL"*.whl)"
      # musl: uv from Alpine's packages, and Python from uv's musl builds.
      - name: Python evals (Alpine)
        if: ${{ matrix.alpine }}
        env:
          BINARY: out/reeval-${{ needs.compile.outputs.version }}-${{ matrix.target }}
          WHEEL: ${{ matrix.wheel }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e BINARY -e WHEEL node:22-alpine sh -c \
            'apk add -q git uv && node scripts/binary-python-smoke.mjs "$BINARY" --wheel wheels/*-any.whl \
              --sdist wheels/*.tar.gz --platform-wheel platform-wheels/*"$WHEEL"*.whl'
      - name: install-test.sh
        if: ${{ !matrix.ext && !matrix.baseline }}
        env:
          ALPINE: ${{ matrix.alpine }}
        run: |
          if [ "$ALPINE" = true ]; then
            docker run --rm -v "$PWD/current:/repo" -w /repo node:22-alpine sh -c 'apk add -q curl && sh scripts/install-test.sh'
          else
            sh current/scripts/install-test.sh
          fi
      # The install scripts pick this runner's target and check it against SHA256SUMS.
      - name: install.sh
        if: ${{ !matrix.ext && !matrix.baseline }}
        env:
          REEVAL_VERSION: ${{ needs.compile.outputs.version }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          if [ "$ALPINE" = true ]; then
            docker run --rm -v "$PWD:/repo" -w /repo -e REEVAL_VERSION node:22-alpine sh -c \
              'apk add -q curl && REEVAL_DOWNLOAD=file:///repo/out REEVAL_INSTALL_DIR=/tmp/bin sh current/scripts/install.sh &&
                test "$(/tmp/bin/reeval --version)" = "$REEVAL_VERSION"'
          else
            REEVAL_DOWNLOAD="file://$PWD/out" REEVAL_INSTALL_DIR="$RUNNER_TEMP/bin" sh current/scripts/install.sh
            test "$("$RUNNER_TEMP/bin/reeval" --version)" = "$REEVAL_VERSION"
          fi
      # A glibc system with musl's loader installed beside it still gets the glibc build.
      - name: install.sh (glibc with musl installed)
        if: ${{ matrix.target == 'linux-x64' }}
        env:
          REEVAL_VERSION: ${{ needs.compile.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e REEVAL_VERSION debian:bookworm-slim sh -c \
            'apt-get update -qq && apt-get install -y -qq musl curl ca-certificates > /dev/null &&
              ls /lib/ld-musl-* &&
              REEVAL_DOWNLOAD=file:///repo/out REEVAL_INSTALL_DIR=/tmp/bin sh current/scripts/install.sh &&
              test "$(/tmp/bin/reeval --version)" = "$REEVAL_VERSION"'
      - name: install.ps1
        if: ${{ matrix.ext && !matrix.baseline }}
        shell: pwsh
        env:
          VERSION: ${{ needs.compile.outputs.version }}
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            Write-Host "== $shell"
            & $shell -NoProfile -ExecutionPolicy Bypass -File current/scripts/install-test.ps1 -Release out -Version $env:VERSION
            if ($LASTEXITCODE -ne 0) { throw "install-test.ps1 failed under $shell" }
          }
