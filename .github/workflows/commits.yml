# Conventional Commits (AGENTS.md, Project rules) for the PR title, which becomes the squash
# commit that release-please reads, and for every commit in the PR. Its own workflow so that
# editing the title re-runs only this.
name: commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commits.mjs "$BASE" "$HEAD"
