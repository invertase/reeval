# ES's own gate: lint, typecheck, build, and the test tiers as parallel jobs. The packages' tests
# run dist/, so every test job builds first (about 2 s). The real-agent tier is in real.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # biome ci: lint and format check, without writing, with GitHub annotations.
      - run: pnpm exec biome ci .

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # evalsuite and examples/hello resolve their workspace dependencies' types from dist/.
      - run: pnpm build
      - run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @invertase/foobar pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7

  unit:
    name: unit and plan (node ${{ matrix.node || 'engines' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The engines floor, and the newest Node that engines.node allows.
        node: ['22.13', '']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { node-version: '${{ matrix.node }}' }
      - run: pnpm build
      - name: evalsuite (every test file but the fixture, Docker, studio and pack ones)
        working-directory: packages/evalsuite
        run: |
          shopt -s extglob
          node --test --test-timeout=600000 --experimental-strip-types --no-warnings \
            test/!(features|docker|studio|pack).test.ts
      # Its real-container tests skip here: there's no sandbox image. The docker job runs them.
      - name: sandbox-docker (without containers)
        run: pnpm --filter @evalsuite/sandbox-docker test

  features:
    name: features (fake)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - working-directory: packages/evalsuite
        env:
          ES_FIXTURE_TIERS: fake
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/features.test.ts

  docker:
    name: docker (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ['@invertase/foobar', '@evalsuite/sandbox-docker']
    env:
      ES_TEST_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: ./.github/actions/sandbox-images
      # evalsuite: the fixtures' Docker tier and test/docker.test.ts. sandbox-docker: its whole
      # suite, real containers included. Both fail rather than skip without Docker.
      - run: pnpm --filter '${{ matrix.package }}' ${{ matrix.package == '@invertase/foobar' && 'test:docker' || 'test' }}

  studio:
    name: studio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - working-directory: packages/evalsuite
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/studio.test.ts
      # The browser test skips without Chrome, so check it's there rather than pass silently.
      - run: google-chrome --version
      - run: pnpm --filter studio-web test

  pack:
    name: packed install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # The release job's npm. npm 10.9 (Node 22's) crashes installing the tarball (edgesOut).
      - run: npm install --global npm@^11.5.1
      - run: pnpm build
      - working-directory: packages/evalsuite
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/pack.test.ts
      # What release.yml publishes, without publishing it. npm's dry run still refuses a version
      # that's already published, so this packs a throwaway prerelease of it.
      - name: npm publish --dry-run
        working-directory: packages/evalsuite
        run: |
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-ci.$GITHUB_RUN_ID"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish --dry-run --access public --tag ci "$RUNNER_TEMP"/pack/*.tgz

  report:
    if: always() && github.event_name == 'pull_request'
    needs: [lint, typecheck, build, unit, features, docker, studio, pack]
    runs-on: ubuntu-24.04
    permissions: { actions: read, pull-requests: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "ci-report ${GITHUB_SHA::7} run $RUN"
            echo '```'
            gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" --jq '.jobs[] | select(.name != "report") | "\(.conclusion // .status)\t\(((.completed_at // (now | todate)) | fromdate) - (.started_at | fromdate))s\t\(.name)"'
            echo '```'
            for id in $(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
              echo "<details><summary>$(gh api "repos/$REPO/actions/jobs/$id" --jq .name)</summary>"; echo; echo '```'
              gh api "repos/$REPO/actions/jobs/$id/logs" 2>&1 | tail -80 | cut -c1-300
              echo '```'; echo '</details>'
            done
          } > report.md
          gh pr comment "$PR" --repo "$REPO" --body-file report.md
