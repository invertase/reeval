# reeval's own gate: lint, typecheck and the test tiers as parallel jobs, summed up by one required
# check, `ci`. The packages' tests run dist/, so every test job builds first (about 8 s: cheaper
# than sharing dist/ as an artifact). The real-agent tier is in real.yml.
#
# Two tiers. PRs and merge-queue entries get the one PR_TIER names (below):
#   light  lint, the build, typecheck and docs, and the unit and plan files in four shards, on every
#          code change; each heavier job only when the files it tests change (the `changes` job).
#   full   every Linux tier on every code change, as before the light tier.
# `main` runs the Linux tiers plus macOS and npm 10.9 (Windows is off for now). The Node 22.13 floor and the
# coverage report run on nightly, workflow_dispatch, release.yml's call and a PR labeled
# `ci:full` (ci-full.yml): newest Node already ran on the PR, and coverage is report-only.
#
# Coverage (nightly, dispatch, release): the test jobs collect V8 coverage from every process
# they start (NODE_V8_COVERAGE, set after the build), and the coverage job merges it. Report-only:
# no threshold.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue: scoped like a PR, over what the merge group adds to main.
  merge_group:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out (release.yml's republish passes the release tag); empty is the event's own
        type: string
        default: ''

permissions:
  contents: read

env:
  # The PRs' and merge queue's tier: `light` or `full`. Set the CI_PR_TIER repository variable
  # (Settings → Secrets and variables → Actions → Variables) to switch without a commit.
  PR_TIER: ${{ vars.CI_PR_TIER || 'light' }}

concurrency:
  # github.workflow is the caller's when release.yml or ci-full.yml calls this, so those runs don't
  # share a group with this workflow's own run and can't be replaced by the next push's. PRs share
  # a group so a newer push replaces the last. Main, nightly and the queue key on the SHA: GitHub
  # cancels queued runs in a group even when cancel-in-progress is false, and a burst of merges
  # used to drop every intermediate main run (only the first in-flight and the last SHA finished).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this run needs. Off PRs and the queue, and with the ci:full label, all of them
  # (`full`: also extended.yml and npm 10.9). Coverage is nightly, dispatch and release only.
  # Otherwise from the files changed against the base (the merge group's base in the queue).
  # Docs-only changes (docs/, docs.json, root-level *.md, skills/, .agents/, issue templates) need only
  # `checks`, which always runs. Any other change needs `unit`, except one only to `packages/api`,
  # which reeval doesn't run on. A change to a workspace package needs its own tests (`packages`),
  # and those of every package that depends on it. On the light tier, the rest follow their
  # own paths, and a change to CI, the lockfile or the workspace needs every job; on the full tier,
  # every code change needs every job.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      # Report-only; newest-Node coverage already landed on the PR. Collect on nightly, a
      # manual run, or release.yml (github.workflow is the caller).
      coverage: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.workflow == 'release' }}
      unit: ${{ steps.scope.outputs.unit }}
      features: ${{ steps.scope.outputs.features }}
      docker: ${{ steps.scope.outputs.docker }}
      studio: ${{ steps.scope.outputs.studio }}
      pack: ${{ steps.scope.outputs.pack }}
      engine: ${{ steps.scope.outputs.engine }}
      launchers: ${{ steps.scope.outputs.launchers }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      # A PR's merge commit has the base it would merge into as its first parent; a merge group's
      # base is further back. Every event checks out: the package list comes from the manifests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'merge_group' && 0 || 2 }}
      - id: scope
        env:
          ALL: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
        run: |
          # The workspace packages with tests of their own, by directory (reeval's are the jobs below).
          declare -A name_of pkgs
          for m in packages/*/package.json; do
            d=${m#packages/} d=${d%/package.json}
            [ "$d" = reeval ] && continue
            n=$(jq -r 'select(.scripts.test) | .name' "$m")
            [ -n "$n" ] && name_of[$d]=$n
          done
          unit=$ALL features=$ALL docker=$ALL studio=$ALL pack=$ALL engine=$ALL launchers=$ALL
          every() {
            unit=true features=true docker=true studio=true pack=true engine=true launchers=true
            for d in "${!name_of[@]}"; do pkgs[$d]=1; done
          }
          if [ "$ALL" = true ]; then every; else
            echo "Tier: $PR_TIER"
            while IFS= read -r f; do
              case $f in
                docs/* | docs.json | skills/* | .agents/* | .github/ISSUE_TEMPLATE/*) continue ;;
                */*) ;;
                *.md | LICENSE) continue ;;
              esac
              case $f in
                packages/*/*)
                  d=${f#packages/} d=${d%%/*}
                  [ -n "${name_of[$d]:-}" ] && pkgs[$d]=1 ;;
              esac
              case $f in
                packages/api/*) ;;
                *) unit=true ;;
              esac
              if [ "$PR_TIER" != light ]; then every; continue; fi
              case $f in
                .github/* | \
                package.json | \
                pnpm-lock.yaml | \
                pnpm-workspace.yaml | \
                patches/* | \
                .pnpmfile.cjs | \
                tsconfig*.json)
                  every; continue ;;
              esac
              case $f in
                packages/reeval/src/engine/* | \
                packages/reeval/test/engine* | \
                packages/reeval/test/helpers.ts | \
                packages/reeval/package.json | \
                packages/reeval/tsdown.config.mjs | \
                scripts/coverage.mjs)
                  engine=true ;;
              esac
              case $f in
                packages/reeval-python/* | \
                packages/reeval/src/language-runner/* | \
                packages/reeval/test/python-sdk.test.ts | \
                packages/reeval/test/language-runner.test.ts)
                  unit=true
                  features=true ;;
              esac
              case $f in
                packages/reeval/src/engine/* | \
                packages/reeval/src/attempt/* | \
                packages/reeval/src/capture/* | \
                packages/reeval/src/sandbox/* | \
                packages/reeval/src/harness/* | \
                packages/agents/* | \
                packages/reeval/src/ui/* | \
                packages/vm-api/* | \
                packages/reeval/src/evaluate.ts | \
                packages/reeval/src/egress.ts | \
                packages/reeval/test/features* | \
                packages/reeval/test/support/*)
                  features=true ;;
              esac
              case $f in
                packages/sandbox-docker/* | \
                packages/vm-api/* | \
                packages/harness-* | \
                packages/reeval/src/sandbox/* | \
                packages/reeval/src/harness/* | \
                packages/agents/* | \
                packages/reeval/src/attempt/* | \
                packages/reeval/src/capture/* | \
                packages/reeval/src/egress.ts | \
                packages/reeval/test/features/* | \
                packages/reeval/test/docker* | \
                packages/reeval/test/sandbox-* | \
                packages/reeval/test/contract* | \
                packages/reeval/test/e2e-real* | \
                packages/reeval/test/cursor-sdk-shape* | \
                packages/reeval/src/store/* | \
                packages/reeval/src/store-s3.ts | \
                packages/reeval/test/store* | \
                packages/reeval/test/support/minio.ts | \
                packages/reeval/test/support/ssh-vm.ts | \
                packages/reeval/test/support/boat.ts | \
                packages/reeval/test/support/fake-tart.ts)
                  docker=true ;;
              esac
              case $f in
                packages/reeval/src/studio/* | \
                packages/reeval/src/view/* | \
                packages/reeval/test/studio*)
                  studio=true ;;
              esac
              case $f in
                packages/*/package.json | \
                packages/reeval/tsdown.config.mjs | \
                packages/reeval/src/root.ts | \
                packages/reeval/test/pack* | \
                packages/sandbox-docker/docker/* | \
                packages/harness-pi/assets/* | \
                scripts/third-party*)
                  pack=true ;;
              esac
              case $f in
                packages/reeval-python/src/reeval_python/cli.py | \
                packages/reeval-python/pyproject.toml | \
                packages/reeval/test/conformance/launcher/* | \
                packages/sandbox-docker/src/egress/cert.ts | \
                scripts/ctrl-c.py)
                  launchers=true ;;
              esac
            done < <(git diff --no-renames --name-only "$BASE" HEAD)
          fi
          # A package's dependents run too (sandbox-docker lists every adapter), until none is added.
          added=true
          while [ "$added" = true ]; do
            added=false
            for d in "${!name_of[@]}"; do
              [ -n "${pkgs[$d]:-}" ] && continue
              for p in "${!pkgs[@]}"; do
                if jq -e --arg n "${name_of[$p]}" '(.dependencies // {}) + (.devDependencies // {}) | has($n)' \
                  "packages/$d/package.json" > /dev/null; then
                  pkgs[$d]=1 added=true
                  break
                fi
              done
            done
          done
          {
            echo "packages=$(printf '%s\n' "${!pkgs[@]}" | sort | xargs)"
            echo "unit=$unit"
            echo "features=$features"
            echo "docker=$docker"
            echo "studio=$studio"
            echo "pack=$pack"
            echo "engine=$engine"
            echo "launchers=$launchers"
          } | tee -a "$GITHUB_OUTPUT"

  # Lint, the build, typecheck, the schema check and the docs checks: each under a minute, so one job.
  checks:
    name: lint, typecheck and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # biome ci: lint and format check, without writing, with GitHub annotations.
      - run: pnpm exec biome ci .
      # US English and common misspellings everywhere but the user docs (_typos.toml). typos'
      # PyPI wheel through the runner's pipx: GitHub release downloads (crate-ci/typos) can 504.
      - if: ${{ !cancelled() }}
        run: pipx run --spec typos==1.51.1 typos
      # Unused files, exports, types and dependencies across the workspace (knip.json).
      - if: ${{ !cancelled() }}
        run: pnpm knip
      # reeval and the examples resolve their workspace dependencies' types from dist/, and
      # the docs' generated blocks come from dist/cli.js (help, query schema).
      - if: ${{ !cancelled() }}
        run: pnpm build
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: persisted shapes (schema/ snapshots)
        if: ${{ !cancelled() }}
        run: pnpm --filter reeval schema:check
      - name: SDK wire types (generated from schema/)
        if: ${{ !cancelled() }}
        run: pnpm --filter reeval sdk-types:check
      # Stale generated blocks, reference coverage, sidebar links and the package name.
      - if: ${{ !cancelled() }}
        run: pnpm docs:check
      # docs.page's own check: internal links, assets and frontmatter targets.
      - if: ${{ !cancelled() }}
        run: npx -y @docs.page/cli@2.1.0 check --external-links warn
      - if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Its default glob walks node_modules for pyproject.toml files: half a minute on Linux,
          # over a minute on Windows.
          cache-dependency-glob: |
            packages/reeval-python/uv.lock
            packages/reeval/test/features/python-sdk/hello/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: reeval-python (uv sync, ruff, pyright, pytest)
        if: ${{ !cancelled() }}
        working-directory: packages/reeval-python
        run: |
          uv sync --locked --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          # Every Python the classifiers name, each in its own environment.
          for v in 3.11 3.12 3.13 3.14; do
            UV_PROJECT_ENVIRONMENT=".venv-$v" uv run --locked --python "$v" pytest -q
          done

  # The unit and plan files on the newest Node that engines.node allows, in four shards (a 2-vCPU
  # runner runs one test file at a time). The engines floor, Node 22.13, runs in extended.yml.
  unit:
    name: unit and plan (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Its default glob walks node_modules for pyproject.toml files: half a minute on Linux,
          # over a minute on Windows.
          cache-dependency-glob: |
            packages/reeval-python/uv.lock
            packages/reeval/test/features/python-sdk/hello/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.coverage == 'true'
        run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - name: reeval (every test file but the fixture, Docker, MinIO, studio, pack and real-agent ones)
        working-directory: packages/reeval
        run: |
          shopt -s extglob
          node --test --test-timeout=600000 --experimental-strip-types --no-warnings \
            --test-shard=${{ matrix.shard }} \
            test/!(features|docker|docker-antigravity|store-minio|studio|pack|contract|e2e-real|questions-real|openrouter-real).test.ts
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: 'unit-${{ strategy.job-index }}' }

  # The other workspace packages' own tests, each a few seconds, for the packages the change
  # touches and their dependents (all of them on a full run). sandbox-docker's real-container
  # tests skip here: there's no sandbox image. The docker job runs them.
  packages:
    name: packages
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - if: needs.changes.outputs.coverage == 'true'
        run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          for p in $PACKAGES; do
            echo "::group::packages/$p"
            (cd "packages/$p" && pnpm test)
            echo "::endgroup::"
          done
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: packages }

  features:
    name: features (fake)
    needs: changes
    if: needs.changes.outputs.features == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Its default glob walks node_modules for pyproject.toml files: half a minute on Linux,
          # over a minute on Windows.
          cache-dependency-glob: |
            packages/reeval-python/uv.lock
            packages/reeval/test/features/python-sdk/hello/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.coverage == 'true'
        run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - working-directory: packages/reeval
        env:
          REEVAL_FIXTURE_TIERS: fake
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/features.test.ts
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: features }

  # The Docker tier, split by test name into legs of a few minutes each. A --test-name-pattern
  # leg and a --test-skip-pattern leg on the same regex run complementary halves of a file, so
  # nothing falls between them. All fail rather than skip without Docker.
  docker:
    name: docker (${{ matrix.package }}, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The fixtures' Docker tier, split by fixture directory: $FIXTURES' directories, then the rest.
          - package: 'reeval'
            part: fixtures 1/2
            run: node --test --experimental-strip-types --no-warnings --test-name-pattern="$FIXTURES" test/features.test.ts
          - package: 'reeval'
            part: fixtures 2/2
            run: node --test --experimental-strip-types --no-warnings --test-skip-pattern="$FIXTURES" test/features.test.ts
          # test/docker.test.ts: the image builds from a from, a dockerfile or a moving tag, then the rest.
          - package: 'reeval'
            part: sandbox 1/2
            run: node --test --experimental-strip-types --no-warnings --test-name-pattern="$IMAGE_BUILDS" test/docker.test.ts
          - package: 'reeval'
            part: sandbox 2/2
            run: node --test --experimental-strip-types --no-warnings --test-skip-pattern="$IMAGE_BUILDS" test/docker.test.ts
          # The Docker sandbox contracts, every machine provider's conformance on its fake backend,
          # Boat's image snapshots built over a fake VM's SSH, the harness contract and e2e CLI
          # suites on their key-free fake row (real rows run in real.yml), and s3() on MinIO.
          - package: 'reeval'
            part: contracts
            run: node --test --experimental-strip-types --no-warnings test/store-minio.test.ts test/docker-antigravity.test.ts test/sandbox-prepare-contract.test.ts test/sandbox-contract.test.ts test/sandbox-provider-conformance.test.ts test/boat-images.test.ts test/contract.test.ts test/e2e-real.test.ts test/cursor-sdk-shape.test.ts
          # Its whole suite, real containers included.
          - package: '@reeval/sandbox-docker'
            part: all
            run: pnpm test
    env:
      REEVAL_FIXTURE_TIERS: docker
      REEVAL_TEST_REQUIRE_DOCKER: '1'
      # docker.test.ts's slowest tests, each building images: about half the file's time.
      IMAGE_BUILDS: 'a from tag that moves upstream|dockerfile: FROM|dockerfile \+ claudeCode|from: a toolchain image'
      # About half the fixtures' Docker time, from each fixture's median on main. Rebalance from
      # the `✔ <dir> [docker] (…ms)` lines in both legs' logs when one leg finishes well after the other.
      FIXTURES: '(^| )(harness|mcp|secrets|egress|compare|assert|judge)/'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Its default glob walks node_modules for pyproject.toml files: half a minute on Linux,
          # over a minute on Windows.
          cache-dependency-glob: |
            packages/reeval-python/uv.lock
            packages/reeval/test/features/python-sdk/hello/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
        if: matrix.package == 'reeval'
      - uses: ./.github/actions/sandbox-images
      - if: needs.changes.outputs.coverage == 'true'
        run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - working-directory: ${{ matrix.package == 'reeval' && 'packages/reeval' || 'packages/sandbox-docker' }}
        run: ${{ matrix.run }}
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with:
          name: docker-${{ strategy.job-index }}

  # podman(): sandbox-docker's container tests and the fixtures' Podman tier, on the rootless
  # Podman GitHub's Ubuntu image ships. systemd delegates only memory and pids to a user's cgroup,
  # so a drop-in adds cpu (podman({ cpus })) before the user manager restarts. Fails without Podman.
  podman:
    name: podman (rootless)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REEVAL_TEST_ENGINE: podman
      REEVAL_TEST_REQUIRE_PODMAN: '1'
      REEVAL_FIXTURE_TIERS: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: rootless Podman with the cpu, memory and pids controllers
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' |
            sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -u)"
          sudo systemctl restart "user@$(id -u).service"
          podman system migrate
          podman info --format '{{.Version.Version}} rootless={{.Host.Security.Rootless}} {{.Host.CgroupManager}} {{.Host.CgroupControllers}} {{.Host.NetworkBackend}}'
      - run: pnpm build
      - name: reeval's image, in Podman's store
        run: |
          node --input-type=module -e "
            import { buildImage } from './packages/sandbox-docker/dist/index.js'
            await buildImage(console.log, { harness: 'cursor', engine: 'podman' })"
      # A test file whose process outlives its tests fails a minute later naming what holds it
      # (scripts/handle-dump.mjs); the step timeout catches any other hang. Normally under 2 min.
      - name: sandbox-docker on Podman
        working-directory: packages/sandbox-docker
        timeout-minutes: 8
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/handle-dump.mjs
          REEVAL_HANDLE_DUMP_DIR: ${{ runner.temp }}/handles
        run: pnpm test
      - name: handle dumps
        if: failure()
        run: |
          shopt -s nullglob
          dumps=("$RUNNER_TEMP"/handles/*.txt)
          [ ${#dumps[@]} -eq 0 ] && echo 'No process dumped its handles.'
          for f in "${dumps[@]}"; do echo "::group::$f"; cat "$f"; echo '::endgroup::'; done
          ps -eo pid,ppid,pgid,stat,etime,args --forest
          podman ps -a
      - name: the fixtures' Podman tier
        working-directory: packages/reeval
        run: node --test --experimental-strip-types --no-warnings --test-name-pattern='\[podman\]' test/features.test.ts

  studio:
    name: studio
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - if: needs.changes.outputs.coverage == 'true'
        run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - working-directory: packages/reeval
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/studio.test.ts
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: studio }

  # The engine's own code (scripts/coverage.mjs ENGINE) must be fully covered by its tests.
  engine-coverage:
    name: engine coverage
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: node scripts/coverage.mjs engine

  # Every SDK's `reeval` launcher against the shared cases in test/conformance/launcher/ (its
  # README), on each OS: download, checksums, cache, offline, overrides, exit codes and Ctrl-C.
  launchers:
    name: launcher conformance (${{ matrix.sdk }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.launchers == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run: { shell: bash }
    strategy:
      fail-fast: false
      matrix:
        sdk: [python]
        # windows-latest is off for now: no one runs reeval on Windows yet.
        os: [ubuntu-24.04, macos-latest]
    steps:
      # Recorded runs' paths pass Windows' 260-character limit, which git keeps by default.
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Builds the suite's stand-in binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: matrix.sdk == 'python'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: packages/reeval-python/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - working-directory: packages/reeval
        run: node --experimental-strip-types --no-warnings test/conformance/launcher/run.ts ${{ matrix.sdk }}

  # Installs the tarball with npm 11 (the release job's) and, off PRs, with Node 22's npm 10.9. npm
  # before 11.6 crashed ("reading 'edgesOut'", npm/cli#8261) on vitest's peer set, which reeval no
  # longer depends on; that leg keeps it that way.
  pack:
    name: packed install (npm ${{ matrix.npm }})
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        npm: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["11", "10.9"]' || '["11"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with: { node-version: "${{ matrix.npm == '10.9' && '22' || '' }}" }
      - run: npm install --global npm@${{ matrix.npm }} && npm --version
      - run: pnpm build
      # pnpm pack rewrites workspace: ranges, and .pnpmfile.cjs drops devDependencies and
      # scripts. On a release commit, release.yml publishes the npm 11 leg's tarball.
      - run: pnpm --filter reeval pack --pack-destination "$RUNNER_TEMP/package"
      - if: matrix.npm == '11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          # release.yml publishes it from its own run; nothing else reads it.
          retention-days: ${{ github.workflow == 'release' && 7 || 1 }}
      # Besides npm, the pack test installs with the runner's Yarn 1 and with strict pnpm, which
      # install no peers.
      - working-directory: packages/reeval
        run: |
          yarn --version
          node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/pack.test.ts
      # npm's dry run still refuses a version that's already published, so this dry-runs a
      # throwaway prerelease of it.
      - name: npm publish --dry-run
        if: matrix.npm == '11'
        working-directory: packages/reeval
        run: |
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-ci.$GITHUB_RUN_ID"
          pnpm pack --pack-destination "$RUNNER_TEMP/dry-run"
          npm publish --dry-run --access public --tag ci "$RUNNER_TEMP"/dry-run/*.tgz

  # macOS on every full run (Windows is off for now). The Node 22.13 floor is nightly / dispatch /
  # release / ci:full: every PR already ran the newest Node that engines allow.
  extended:
    name: extended
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/extended.yml
    with:
      floor: ${{ github.event_name != 'push' || github.workflow != 'ci' }}
      ref: ${{ inputs.ref }}

  coverage:
    name: coverage
    needs: [changes, unit, packages, features, docker, studio]
    # Report what ran even when a test job failed; report-only, so a low number never fails it.
    if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # c8 maps the coverage through dist/ and its source maps, at the paths the test jobs ran.
      - run: pnpm build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-raw-*
          path: ${{ runner.temp }}/coverage
      - name: code coverage
        run: |
          node scripts/coverage.mjs report "$RUNNER_TEMP"/coverage/*
          cat coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: feature matrix
        working-directory: packages/reeval
        run: pnpm -s features:matrix >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14

  # The one required check: fails when any job above failed or was canceled. A job the change
  # doesn't need is skipped, which passes. `always()`, so a canceled run fails it rather than
  # skipping it (a skipped required check counts as passed).
  ci:
    name: ci
    needs: [changes, checks, unit, packages, features, docker, podman, studio, engine-coverage, launchers, pack, extended]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A required job failed or was canceled (listed above)."
            exit 1
          fi
