# ES's own gate: lint, typecheck and the test tiers as parallel jobs. The packages' tests run
# dist/, so every test job builds first (about 2 s). The real-agent tier is in real.yml.
# release.yml calls this on the release commit and publishes the tarball the pack job uploads.
# The test jobs collect V8 coverage from every process they start (NODE_V8_COVERAGE, set after
# the build), and the coverage job merges it into one report. It's report-only: no threshold.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's when release.yml calls this, so the release's run doesn't
  # share a group with main's own run and can't be replaced by the next push's.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # biome ci: lint and format check, without writing, with GitHub annotations.
      - run: pnpm exec biome ci .

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # evalsuite and examples/hello resolve their workspace dependencies' types from dist/.
      - run: pnpm build
      - run: pnpm typecheck
      - name: persisted shapes (schema/ snapshots)
        run: pnpm --filter @invertase/foobar schema:check

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # The generated blocks come from dist/cli.js (help, query schema), so build first.
      - run: pnpm build
      # Stale generated blocks, reference coverage, sidebar links and the package name.
      - run: pnpm docs:check
      # docs.page's own check: internal links, assets and frontmatter targets.
      - run: npx -y @docs.page/cli@2.1.0 check --external-links warn

  unit:
    name: unit and plan (node ${{ matrix.node || 'engines' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The engines floor, and the newest Node that engines.node allows.
        node: ['22.13', '']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { node-version: '${{ matrix.node }}' }
      - run: pnpm build
      # Coverage on one leg is enough: both run the same code.
      - if: matrix.node == ''
        run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - name: evalsuite (every test file but the fixture, Docker, studio, pack and real-agent ones)
        working-directory: packages/evalsuite
        run: |
          shopt -s extglob
          node --test --test-timeout=600000 --experimental-strip-types --no-warnings \
            test/!(features|docker|docker-antigravity|studio|pack|contract|e2e-real).test.ts
      # Its real-container tests skip here: there's no sandbox image. The docker job runs them.
      - name: sandbox-docker (without containers)
        run: pnpm --filter @evalsuite/sandbox-docker test
      - name: harness-antigravity
        run: pnpm --filter @evalsuite/harness-antigravity test
      - name: harness-cursor-sdk
        run: pnpm --filter @evalsuite/harness-cursor-sdk test
      - name: harness-opencode
        run: pnpm --filter @evalsuite/harness-opencode test
      - name: harness-goose
        run: pnpm --filter @evalsuite/harness-goose test
      - name: harness-pi
        run: pnpm --filter @evalsuite/harness-pi test
      - name: harness-codex
        run: pnpm --filter @evalsuite/harness-codex test
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: unit }

  features:
    name: features (fake)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - working-directory: packages/evalsuite
        env:
          ES_FIXTURE_TIERS: fake
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/features.test.ts
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: features }

  docker:
    name: docker (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ['@invertase/foobar', '@evalsuite/sandbox-docker']
    env:
      ES_TEST_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: ./.github/actions/sandbox-images
      - run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      # evalsuite: the fixtures' Docker tier, test/docker.test.ts, the Docker sandbox contract, and
      # the harness contract and e2e CLI suites on their key-free fake row (real rows run in real.yml).
      # sandbox-docker: its whole suite, real containers included. All fail rather than skip
      # without Docker.
      - run: pnpm --filter '${{ matrix.package }}' ${{ matrix.package == '@invertase/foobar' && 'test:docker test/sandbox-contract.test.ts' || 'test' }}
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with:
          name: docker-${{ strategy.job-index }}

  studio:
    name: studio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: echo "NODE_V8_COVERAGE=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"
      - working-directory: packages/evalsuite
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/studio.test.ts
      # The browser test skips without Chrome, so check it's there rather than pass silently.
      - run: google-chrome --version
      - run: pnpm --filter studio-web test
      - if: ${{ !cancelled() && env.NODE_V8_COVERAGE != '' }}
        uses: ./.github/actions/upload-coverage
        with: { name: studio }

  # The engine's own code (scripts/coverage.mjs ENGINE) must be fully covered by its tests.
  engine-coverage:
    name: engine coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: node scripts/coverage.mjs engine

  # ES's engine against the Vitest engine's captured runs (scripts/differential.mjs). Recording
  # Vitest live first shows the captures are still what it does.
  engine-differential:
    name: engine differential
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: the captures are the Vitest engine's
        run: |
          node --experimental-strip-types --no-warnings scripts/differential.mjs record vitest "$RUNNER_TEMP/vitest"
          node --experimental-strip-types --no-warnings scripts/differential.mjs compare packages/evalsuite/test/differential/vitest "$RUNNER_TEMP/vitest"
      - name: ES's engine does the same
        run: |
          node --experimental-strip-types --no-warnings scripts/differential.mjs record es "$RUNNER_TEMP/es"
          node --experimental-strip-types --no-warnings scripts/differential.mjs compare packages/evalsuite/test/differential/vitest "$RUNNER_TEMP/es"

  coverage:
    name: coverage
    needs: [unit, features, docker, studio]
    # Report what ran even when a test job failed; report-only, so a low number never fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # c8 maps the coverage through dist/ and its source maps, at the paths the test jobs ran.
      - run: pnpm build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-raw-*
          path: ${{ runner.temp }}/coverage
      - name: code coverage
        run: |
          node scripts/coverage.mjs report "$RUNNER_TEMP"/coverage/*
          cat coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: feature matrix
        working-directory: packages/evalsuite
        run: pnpm -s features:matrix >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14

  # Installs the tarball with Node 22's npm 10.9 and with npm 11. npm before 11.6 crashes
  # ("reading 'edgesOut'", npm/cli#8261) when vitest's peer set pulls in a newer vitest than
  # the one the ~5.0.x range resolves to, so this leg fails once vitest ships a new minor.
  pack:
    name: packed install (npm ${{ matrix.npm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { npm: '10.9', node: '22' }
          # The release job's npm.
          - { npm: '11', node: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { node-version: '${{ matrix.node }}' }
      - run: npm install --global npm@${{ matrix.npm }} && npm --version
      - run: pnpm build
      # pnpm pack rewrites workspace: ranges, and .pnpmfile.cjs drops devDependencies and
      # scripts. On a release commit, release.yml publishes the npm 11 leg's tarball.
      - run: pnpm --filter @invertase/foobar pack --pack-destination "$RUNNER_TEMP/package"
      - if: matrix.npm == '11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7
      # Besides npm, the pack test installs with the runner's Yarn 1 and with strict pnpm, which
      # install no peers.
      - working-directory: packages/evalsuite
        run: |
          yarn --version
          node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/pack.test.ts
      # npm's dry run still refuses a version that's already published, so this dry-runs a
      # throwaway prerelease of it.
      - name: npm publish --dry-run
        if: matrix.npm == '11'
        working-directory: packages/evalsuite
        run: |
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-ci.$GITHUB_RUN_ID"
          pnpm pack --pack-destination "$RUNNER_TEMP/dry-run"
          npm publish --dry-run --access public --tag ci "$RUNNER_TEMP"/dry-run/*.tgz

  # The required check: passes only when every npm leg of the pack job passed.
  packed-install:
    name: packed install
    needs: pack
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.pack.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::packed install (npm 10.9 / npm 11): $RESULT"
            exit 1
          fi
