# Temporary: exercises release.yml's test and publish path on the PR, without publishing.
name: release dry run

on:
  pull_request:

permissions: {}

jobs:
  test:
    name: test
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish (dry run)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - run: |
          npm -v
          ls -l "$RUNNER_TEMP"/package
          tar -xzOf "$RUNNER_TEMP"/package/*.tgz package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version'
          tar -tzf "$RUNNER_TEMP"/package/*.tgz | grep -c . 

  report:
    name: report
    needs: [test, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BODY: 'release dry run on ${{ github.event.pull_request.head.sha }}: test=${{ needs.test.result }}, publish=${{ needs.publish.result }}'
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "$BODY"
