# The real-agent tier: real agents in Docker, nightly, on demand, and on PRs labelled
# `real-agents`. It spends model credit, so it runs only in this repository (never a fork's code).
# A missing secret fails the rows that need it, naming the variable: asked for, the real tier never
# skips. One run at a time.
#   contract (pinned)    the harness contract, the real-tier fixtures, the @cursor/sdk shape check
#                        and the CLI end to end, on the pinned agent versions
#   contract (latest)    the version-drift leg: the same but the e2e, on the newest agy, @cursor/sdk,
#                        OpenCode, Goose and pi, and the newest OpenCode's providers re-probed
#   real agents (Cursor) examples/hello's smoke profile, then its compare questions on a real
#                        model (test/questions-real.test.ts)
# PRs get the pinned contract only. Budgets: each reeval run's budget.attempts, a ledger per job
# (contract.yml) and the timeouts below.
name: real

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      latest:
        description: Also run the contract on the newest agent CLI and SDK (the drift leg)
        type: boolean
        default: true
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: real-${{ github.event.pull_request.number || github.ref }}
  # A PR's newer push replaces its run; the nightly and dispatched runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    # This repository only; on a PR, only its own branches and only with the label.
    if: >-
      github.repository == 'invertase/reeval' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'real-agents')))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Annotates up front; the rows that need a missing key fail in the contract legs.
      - env:
          HAS_CURSOR: ${{ secrets.CURSOR_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          [ "$HAS_CURSOR" = true ] || echo "::error::No CURSOR_API_KEY repository secret: the Cursor rows and the example smoke fail"
          [ "$HAS_GEMINI" = true ] || echo "::error::No GOOGLE_GENERATIVE_AI_API_KEY repository secret: the Antigravity, OpenCode, Goose and pi rows and the example smoke fail"
          [ "$HAS_ANTHROPIC" = true ] || echo "::error::No ANTHROPIC_API_KEY repository secret: the Claude Code rows fail"
          [ "$HAS_OPENAI" = true ] || echo "::error::No OPENAI_API_KEY repository secret: the Codex and fx rows fail"
          true

  pinned:
    name: contract (pinned)
    needs: gate
    uses: ./.github/workflows/contract.yml
    with: { versions: pinned }
    secrets: inherit

  latest:
    name: contract (latest)
    needs: [gate, pinned]
    # After the pinned leg, pass or fail, so the two never spend at once.
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.latest))
    uses: ./.github/workflows/contract.yml
    with: { versions: latest }
    secrets: inherit

  real:
    name: real agents (Cursor)
    needs: [gate, latest]
    if: >-
      !cancelled() && needs.gate.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      # The questions test's 4 attempts (2 on Cursor, 2 on pi), reserved before it starts; the
      # smoke's own budget.attempts caps it.
      REEVAL_REAL_ATTEMPT_BUDGET: '4'
      REEVAL_REAL_LEDGER: ${{ github.workspace }}/../reeval-real-ledger
    steps:
      # Eval code runs on the host with the keys, so the job keeps no git token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: ./.github/actions/sandbox-images
      # The real-tier fixtures ran in the contract legs; this is examples/hello's smoke profile.
      # Without either key, reeval run exits 2 naming it.
      - name: examples/hello smoke
        working-directory: examples/hello
        run: node ../../packages/reeval/dist/cli.js run --profile smoke
      # examples/hello's questions profile: its compare question answered by a real model. Checks
      # the record's structure only (both orders of every pair, rates, no position bias), no retries.
      - name: compare questions (real model)
        if: ${{ !cancelled() }}
        working-directory: packages/reeval
        env: { REEVAL_TEST_REAL: '1' }
        run: node --test --test-timeout=1800000 --experimental-strip-types --no-warnings test/questions-real.test.ts
      - if: always()
        run: |
          [ -f "$REEVAL_REAL_LEDGER" ] && { echo '### Real attempts reserved'; echo; echo '```'; cat "$REEVAL_REAL_LEDGER"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reeval-runs-${{ github.run_id }}
          path: examples/hello/.reeval/runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
