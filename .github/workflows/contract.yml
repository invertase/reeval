# The real agents in Docker, on the pinned agent versions or the newest ones: the harness contract,
# the real-tier feature fixtures (real Cursor, `harness/cursor-web-fetch` among them), the check that
# @cursor/sdk still declares what the Cursor harness recovers web calls from, and (pinned only) the
# CLI end to end. Called by real.yml only, which gates it on this repository and its secrets.
# `versions: latest` first swaps the newest `agy`, @cursor/sdk, OpenCode, Goose, pi and Codex into
# the pinned images
# (scripts/drift/latest-images.sh, which fails if it can't): the version-drift leg, where any change
# to an agent's output format, its stored conversation or its behaviour fails a check, never skips.
# It also checks the newest @ai-sdk/harness-claude-code against ES's patch to the pinned one
# (scripts/drift/claude-code-patch.mjs): it fails once upstream fixes the bug or the patch stops
# applying. And it re-probes the newest @opencode/cli's providers (scripts/drift/
# opencode-providers.mjs): it fails, with a diff, when the OpenCode provider table would change.
name: contract

on:
  workflow_call:
    inputs:
      versions:
        description: pinned (the images as built) or latest (the newest agent CLI and SDK swapped in)
        type: string
        required: true

permissions:
  contents: read

jobs:
  contract:
    name: contract and e2e
    runs-on: ubuntu-24.04
    # The latest leg also probes OpenCode's providers (about 20 minutes), and skips the e2e.
    timeout-minutes: ${{ inputs.versions == 'latest' && 75 || 55 }}
    env:
      ES_TEST_REAL: '1'
      ES_TEST_REQUIRE_DOCKER: '1'
      # Every real row; one without its key fails, naming the variable.
      ES_CONTRACT_HARNESSES: cursor,antigravity,claude-code,opencode,opencode-anthropic,opencode-openai,goose,pi,codex
      # The hard cap for this job: the contract (12 attempts) on all nine rows, the e2e (2) on the
      # seven harnesses' own rows, and the real-tier fixtures (2 each, 8 of them). Each reserves its
      # attempts in the ledger first, and fails rather than go over.
      ES_REAL_ATTEMPT_BUDGET: '138'
      ES_REAL_LEDGER: ${{ github.workspace }}/../es-real-ledger
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      # Eval code runs on the host with the keys, so the job keeps no git token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: ./.github/actions/sandbox-images
      - if: inputs.versions == 'latest'
        name: swap in the newest agent CLI and SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/drift/latest-images.sh
      # Key-free: flags the newest adapter fixing the bug ES patches (drop the patch) or the patch
      # no longer applying (rebase it).
      - if: inputs.versions == 'latest'
        name: whether the newest @ai-sdk/harness-claude-code still needs ES's patch
        run: node --experimental-strip-types --no-warnings scripts/drift/claude-code-patch.mjs
      # One suite at a time, one real row at a time; no retries: a failure is reported as it is.
      - name: harness contract${{ inputs.versions == 'pinned' && ' and e2e CLI scenarios' || '' }}
        working-directory: packages/evalsuite
        env:
          ES_CONTRACT_SUMMARY: ${{ runner.temp }}/contract-summary.md
          ES_TEST_KEEP: '1'
          TMPDIR: ${{ runner.temp }}/es-tests
        run: |
          mkdir -p "$TMPDIR"
          files=test/contract.test.ts
          [ "${{ inputs.versions }}" = pinned ] && files="$files test/e2e-real.test.ts"
          node --test --test-concurrency=1 --test-timeout=3600000 --experimental-strip-types --no-warnings $files
      - name: the stored conversation @cursor/sdk declares
        working-directory: packages/evalsuite
        run: node --test --experimental-strip-types --no-warnings test/cursor-sdk-shape.test.ts
      # Real Cursor: without its key each fixture fails, naming CURSOR_API_KEY.
      - name: real-tier fixtures on Cursor (web fetch recovery included)
        working-directory: packages/evalsuite
        env:
          ES_FIXTURE_TIERS: real
          ES_TEST_KEEP: '1'
          TMPDIR: ${{ runner.temp }}/es-tests
        run: node --test --test-concurrency=1 --test-timeout=3600000 --experimental-strip-types --no-warnings test/features.test.ts
      # Key-free (the probe's proxy answers every request itself), and whatever the contract did:
      # the newest @opencode/cli probed per provider as the committed table was, failing with a
      # diff when the table would change (scripts/drift/opencode-providers.mjs).
      - if: ${{ !cancelled() && inputs.versions == 'latest' }}
        name: whether the newest @opencode/cli sends each provider's key where the table says
        run: node --experimental-strip-types --no-warnings scripts/drift/opencode-providers.mjs
      - if: always()
        name: summary
        run: |
          [ -f "$RUNNER_TEMP/contract-summary.md" ] && cat "$RUNNER_TEMP/contract-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ -f "$ES_REAL_LEDGER" ] && { echo '### Real attempts reserved'; echo; echo '```'; cat "$ES_REAL_LEDGER"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: es-real-${{ inputs.versions }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/es-tests/**/.es/runs
            ${{ runner.temp }}/es-tests/**/.es/debug
            ${{ runner.temp }}/es-tests/**/evals/.history
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
