# The real agents in Docker, on the pinned agent versions or the newest ones: the harness contract,
# the real-tier feature fixtures (real Cursor, `harness/cursor-web-fetch` among them), the check that
# @cursor/sdk still declares what the Cursor harness recovers web calls from, and (pinned only) the
# CLI end to end. Called by real.yml only, which gates it on this repository and its secrets.
# `versions: latest` first swaps the newest `agy`, @cursor/sdk, OpenCode, Goose, pi and Codex into
# the pinned images
# (scripts/drift/latest-images.sh, which fails if it can't): the version-drift leg, where any change
# to an agent's output format, its stored conversation or its behavior fails a check, never skips.
# After the contract, whatever it did, it checks the newest @ai-sdk/harness-claude-code against
# reeval's patch to the pinned one (scripts/drift/claude-code-patch.mjs): it fails once upstream
# fixes the bug or the patch stops applying. And it re-probes the newest @opencode/cli's providers
# (scripts/drift/opencode-providers.mjs): it fails, with a diff, when the OpenCode provider table
# would change.
name: contract

on:
  workflow_call:
    inputs:
      versions:
        description: pinned (the images as built) or latest (the newest agent CLI and SDK swapped in)
        type: string
        required: true
      harnesses:
        description: >-
          Only these rows, comma-separated, in the contract and e2e suites (the *-gateway and
          *-openrouter rows, which the default list leaves out, included); the Cursor checks after
          them are skipped. Naming an *-openrouter row also runs reeval's own calls on OpenRouter
          (test/openrouter-real.test.ts). Empty: the default list
        type: string
        default: ''

permissions:
  contents: read
  # Google's workload identity federation, for the Vertex rows' Application Default Credentials.
  id-token: write

jobs:
  contract:
    name: contract and e2e
    runs-on: ubuntu-24.04
    # The latest leg also probes OpenCode's providers (about 20 minutes), and skips the e2e.
    timeout-minutes: ${{ inputs.versions == 'latest' && 75 || 55 }}
    env:
      REEVAL_TEST_REAL: '1'
      REEVAL_TEST_REQUIRE_DOCKER: '1'
      # Every real row, or the ones asked for; one without its key fails, naming the variable.
      REEVAL_CONTRACT_HARNESSES: ${{ inputs.harnesses || 'cursor,antigravity,claude-code,opencode,opencode-anthropic,opencode-openai,goose,pi,codex,fx,grok-build' }}
      # The hard cap for this job: the contract on all eleven rows (22 attempts on Cursor and
      # Antigravity, whose plugin fields load rules; 20 on Claude Code and Grok Build, whose don't;
      # 16 on Codex and Goose, whose plugins have no hooks or subagents; 18 on OpenCode, with
      # subagents but no hooks; 16 on pi and fx, with neither; 12 on the two without), the e2e (2)
      # on the nine harnesses' own rows, and the real-tier fixtures (2 each, 13 of them):
      # 44 + 40 + 32 + 18 + 32 + 24 + 18 + 26, plus 8 of headroom. Each reserves its attempts in
      # the ledger first, and fails rather than go over.
      REEVAL_REAL_ATTEMPT_BUDGET: '242'
      REEVAL_REAL_LEDGER: ${{ github.workspace }}/../reeval-real-ledger
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      # The *-gateway rows, when REEVAL_CONTRACT_HARNESSES names them.
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # The *-openrouter rows and reeval's own OpenRouter calls, when REEVAL_CONTRACT_HARNESSES
      # names one.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # The *-vertex rows, when REEVAL_CONTRACT_HARNESSES names them: vertex() takes the project from GOOGLE_CLOUD_PROJECT, and the
      # token from the credentials file the auth step writes.
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      # Eval code runs on the host with the keys, so the job keeps no git token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      # Sets GOOGLE_APPLICATION_CREDENTIALS to a short-lived federated credentials file.
      - if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - run: pnpm build
      - uses: ./.github/actions/sandbox-images
      - if: inputs.versions == 'latest'
        name: swap in the newest agent CLI and SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/drift/latest-images.sh
      # The Python SDK's real-tier fixture runs its eval with `uv sync` and `uv run` on the host.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Its default glob walks node_modules for pyproject.toml files: half a minute on Linux,
          # over a minute on Windows.
          cache-dependency-glob: |
            packages/reeval-python/uv.lock
            packages/reeval/test/features/python-sdk/hello/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # One suite at a time, one real row at a time; no retries: a failure is reported as it is.
      - name: harness contract${{ inputs.versions == 'pinned' && ' and e2e CLI scenarios' || '' }}
        working-directory: packages/reeval
        env:
          REEVAL_CONTRACT_SUMMARY: ${{ runner.temp }}/contract-summary.md
          REEVAL_TEST_KEEP: '1'
          TMPDIR: ${{ runner.temp }}/reeval-tests
        run: |
          mkdir -p "$TMPDIR"
          files=test/contract.test.ts
          [ "${{ inputs.versions }}" = pinned ] && files="$files test/e2e-real.test.ts"
          node --test --test-concurrency=1 --test-timeout=3600000 --experimental-strip-types --no-warnings $files
      # One real attempt on the fake harness: the Jev judge and the analysis model through
      # openrouter(), recording the served model, the upstream provider and the cost.
      - name: reeval's own calls on OpenRouter
        if: ${{ !cancelled() && contains(inputs.harnesses, 'openrouter') }}
        working-directory: packages/reeval
        env:
          REEVAL_TEST_KEEP: '1'
          TMPDIR: ${{ runner.temp }}/reeval-tests
        run: node --test --test-timeout=600000 --experimental-strip-types --no-warnings test/openrouter-real.test.ts
      - name: the stored conversation @cursor/sdk declares
        if: inputs.harnesses == ''
        working-directory: packages/reeval
        run: node --test --experimental-strip-types --no-warnings test/cursor-sdk-shape.test.ts
      # Real Cursor: without its key each fixture fails, naming CURSOR_API_KEY.
      - name: real-tier fixtures on Cursor (web fetch recovery included)
        if: inputs.harnesses == ''
        working-directory: packages/reeval
        env:
          REEVAL_FIXTURE_TIERS: real
          REEVAL_TEST_KEEP: '1'
          TMPDIR: ${{ runner.temp }}/reeval-tests
        run: node --test --test-concurrency=1 --test-timeout=3600000 --experimental-strip-types --no-warnings test/features.test.ts
      # The drift checks come last and run whatever the steps before them did: a failing one fails
      # the leg, but never skips its contract. Key-free: flags the newest adapter fixing the bug
      # reeval patches (drop the patch) or the patch no longer applying (rebase it).
      - if: ${{ !cancelled() && inputs.versions == 'latest' }}
        name: whether the newest @ai-sdk/harness-claude-code still needs reeval's patch
        run: node --experimental-strip-types --no-warnings scripts/drift/claude-code-patch.mjs
      # Key-free (the probe's proxy answers every request itself), and whatever the contract did:
      # the newest @opencode/cli probed per provider as the committed table was, failing with a
      # diff when the table would change (scripts/drift/opencode-providers.mjs).
      - if: ${{ !cancelled() && inputs.versions == 'latest' }}
        name: whether the newest @opencode/cli sends each provider's key where the table says
        run: node --experimental-strip-types --no-warnings scripts/drift/opencode-providers.mjs
      - if: always()
        name: summary
        run: |
          [ -f "$RUNNER_TEMP/contract-summary.md" ] && cat "$RUNNER_TEMP/contract-summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ -f "$REEVAL_REAL_LEDGER" ] && { echo '### Real attempts reserved'; echo; echo '```'; cat "$REEVAL_REAL_LEDGER"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reeval-real-${{ inputs.versions }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reeval-tests/**/.reeval/runs
            ${{ runner.temp }}/reeval-tests/**/.reeval/debug
            ${{ runner.temp }}/reeval-tests/**/evals/.history
          include-hidden-files: true
          if-no-files-found: ignore
          # A nightly run's artifact feeds the corpus's real entries; a PR's only its own review.
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 14 }}
