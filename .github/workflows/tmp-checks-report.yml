name: tmp checks report
on: pull_request
permissions:
  actions: read
  checks: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for i in $(seq 1 170); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name != "report")]')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            [ "$pending" = 0 ] && break
            sleep 30
          done
          {
            echo "tmp checks report for $SHA"
            echo '```'
            echo "$runs" | jq -r '.[] | "\(.name): \(.status) \(.conclusion)"' | sort
            echo '```'
            for id in $(gh run list --repo "$REPO" --commit "$SHA" --json databaseId,conclusion --jq '.[] | select(.conclusion == "failure") | .databaseId'); do
              echo "failed run $id:"
              echo '```'
              gh run view "$id" --repo "$REPO" --log-failed | tail -120 | cut -c1-300
              echo '```'
            done
          } > report.md
          gh pr comment "$PR" --repo "$REPO" --body-file report.md
