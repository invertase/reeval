name: Upload the job's coverage
description: Merge the V8 coverage in $NODE_V8_COVERAGE down to this repo's code and upload it for the coverage job
inputs:
  name:
    description: A name for this job's coverage, unique in the workflow run
    required: true
runs:
  using: composite
  steps:
    - run: node scripts/coverage.mjs prune "$NODE_V8_COVERAGE"
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-raw-${{ inputs.name }}
        path: ${{ env.NODE_V8_COVERAGE }}
        if-no-files-found: error
        retention-days: 7
