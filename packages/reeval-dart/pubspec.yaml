name: reeval
description: >-
  Write evals for coding agents in Dart. A real agent does each task in a sandbox, and reeval checks
  the result with assertions and an LLM judge.
version: 0.13.0 # x-release-please-version
homepage: https://reeval.ai
repository: https://github.com/invertase/reeval/tree/main/packages/reeval-dart
issue_tracker: https://github.com/invertase/reeval/issues
topics:
  - evals
  - agents
  - testing
  - llm

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.7
  ffi: ^2.1.0
  matcher: ^0.12.17
  meta: ^1.16.0
  stack_trace: ^1.12.0
  test_api: ">=0.7.0 <0.8.0"

dev_dependencies:
  checks: ^0.3.1
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.26.0

executables:
  reeval: reeval
